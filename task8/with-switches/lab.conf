# task8: DCR2611 静态路由实验（带 OVS 交换机，Kali/Linux 版）
#
# 这个版本用两台 kathara/openvswitch 交换机还原 DCS3600 / DCRS552。
# 在 macOS/OrbStack 上会被 sw1/sw2 的启动保护拦住，请使用上一层的 lab.conf。
#
# 接口对应：
#   sw1 eth0 -> PC A，sw1 eth1 -> r1 F0/0
#   sw2 eth0 -> PC B，sw2 eth1 -> r2 F0/0
#   r1 eth0 -> sw1，r1 eth1 -> r2
#   r2 eth0 -> sw2，r2 eth1 -> r1

sw1[type]="switch"
sw1[image]="kathara/openvswitch"
sw1[0]=netA
sw1[1]=netSWA

sw2[type]="switch"
sw2[image]="kathara/openvswitch"
sw2[0]=netB
sw2[1]=netSWB

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netSWA
r1[1]=netWAN

r2[type]="router"
r2[image]="kathara/base"
r2[sysctl]="net.ipv4.ip_forward=1"
r2[0]=netSWB
r2[1]=netWAN

pca[type]="pc"
pca[0]=netA

pcb[type]="pc"
pcb[0]=netB
