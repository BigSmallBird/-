# task8: DCR2611 静态路由实验（macOS/OrbStack 安全版）
#
# 拓扑：
#   PC A --- r1 --- WAN --- r2 --- PC B
#
# 说明：
# 图中的 DCS3600 / DCRS552 是二层交换机，每个交换机只连接一个路由器和
# 一台 PC。在 Kathara 中，collision domain 本身就等同于一个二层广播域，
# 所以默认版用直连链路代替这两台交换机，三层配置和实验结果完全一致。
# 如果要在 Kali/Linux 上还原 OVS 交换机，请使用 with-switches/ 目录。
#
# 接口对应：
#   r1 eth0 = F0/0 = 192.168.1.1/24   （接 PC A）
#   r1 eth1 = S0/2 = 211.1.1.1/24     （接 r2）
#   r2 eth0 = F0/0 = 211.2.2.1/24     （接 PC B）
#   r2 eth1 = S0/3 = 211.1.1.2/24     （接 r1）

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netA
r1[1]=netWAN

r2[type]="router"
r2[image]="kathara/base"
r2[sysctl]="net.ipv4.ip_forward=1"
r2[0]=netB
r2[1]=netWAN

pca[type]="pc"
pca[0]=netA

pcb[type]="pc"
pcb[0]=netB
