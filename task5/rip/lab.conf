# task5/rip: 用 RIP 动态路由替代静态路由（拓扑与实验五完全一样）
#
#   PCA 192.168.1.10/24                     PCB 192.168.3.10/24
#        │                                        │
#   F0/0 192.168.1.1                      F0/0 192.168.3.1
#      ┌─┴─┐        s0/2        s0/2        ┌─┴─┐
#      │ r1├──── 192.168.2.1 ──── 192.168.2.2┤ r2│
#      └───┘                            192.168.2.0/24   └───┘
#
# 与 task5 的区别：r1/r2 不再写静态路由，改用 RIP 互相学习。
# 路由器镜像换成 kathara/frr（内置 FRRouting）。

r1[type]="router"
r1[image]="kathara/frr"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netA
r1[1]=netRR

r2[type]="router"
r2[image]="kathara/frr"
r2[sysctl]="net.ipv4.ip_forward=1"
r2[0]=netB
r2[1]=netRR

pca[type]="pc"
pca[0]=netA

pcb[type]="pc"
pcb[0]=netB
