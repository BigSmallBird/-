# task4 macOS/OrbStack 版：用 802.1Q 标签代替交换机（不会广播风暴）
#
# 三段拓扑的数据面完全相同：
#   PCA(VLAN100) ─┐
#                 ├── netTrunk ── r1: eth0.100 / eth0.200
#   PCB(VLAN200) ─┘
#
# 交换机在这里的活是「给 access 口打标签、把 trunk 上的标签透传」。
# Kathara 的 collision domain 本来就透明转发 802.1Q 帧，所以让 PC 自己打标签、
# 三层设备自己终结标签，效果与 on-a-stick / l3-switch 两个 Linux 版一致。
#
# 这个 lab 同时对应：
#   ① 路由器子接口 f0/0.1 / f0/0.2（把 r1 当成路由器看）
#   ② 三层交换机 interface vlan 100 / 200（把 r1 当成三层交换机看）

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netTrunk

pca[type]="pc"
pca[0]=netTrunk

pcb[type]="pc"
pcb[0]=netTrunk
