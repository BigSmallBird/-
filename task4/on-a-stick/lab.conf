# task4-① 单臂路由（Router-on-a-Stick）—— Linux/Kali 版
#
#   192.168.1.10                                      192.168.2.10
#   PCA (VLAN100) ── eth0 ─┐                    ┌─ eth1 ── PCB (VLAN200)
#                          ├── sw1 ══ trunk ═══ r1
#                          └────────────────────┘
#
# 接口对应：
#   sw1 eth0 = 1 号口  access VLAN100  -> PCA
#   sw1 eth1 = 9 号口  access VLAN200  -> PCB
#   sw1 eth2 = 24 号口 trunk 100,200   -> r1 F0/0
#   r1 eth0.100 = f0/0.1 封装 dot1Q 100 = 192.168.1.1/24
#   r1 eth0.200 = f0/0.2 封装 dot1Q 200 = 192.168.2.1/24
#
# 注意：sw1 的 OVS 配置在 macOS/OrbStack 上会触发广播风暴，
# sw1.startup 已加内核保护。Mac 上用 ../macos/ 目录。

sw1[type]="switch"
sw1[image]="kathara/openvswitch"
sw1[0]=netPCA
sw1[1]=netPCB
sw1[2]=netTrunk

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netTrunk

pca[type]="pc"
pca[0]=netPCA

pcb[type]="pc"
pcb[0]=netPCB
