# task4-② 三层交换机 VLAN 虚接口（VLANIF / SVI）—— Linux/Kali 版
#
#   192.168.1.10                                      192.168.2.10
#   PCA (VLAN100) ── eth0 ─┐                    ┌─ eth1 ── PCB (VLAN200)
#                          ├── sw1 ══ trunk ═══ l3sw
#                          └────────────────────┘
#
# 接口对应：
#   sw1  eth0 = access VLAN100 -> PCA
#   sw1  eth1 = access VLAN200 -> PCB
#   sw1  eth2 = 24 号口 trunk 100,200 -> l3sw E0/0/24
#   l3sw eth0.100 = interface vlan 100 = 192.168.1.1/24
#   l3sw eth0.200 = interface vlan 200 = 192.168.2.1/24
#
# 三层交换机在 Kathara 里就是一台开了 IPv4 转发、带 VLAN 子接口的容器。
# 数据面和单臂路由一样，区别在于网关由交换机自己终结，不再占用路由器物理口。

sw1[type]="switch"
sw1[image]="kathara/openvswitch"
sw1[0]=netPCA
sw1[1]=netPCB
sw1[2]=netTrunk

l3sw[type]="router"
l3sw[image]="kathara/base"
l3sw[sysctl]="net.ipv4.ip_forward=1"
l3sw[0]=netTrunk

pca[type]="pc"
pca[0]=netPCA

pcb[type]="pc"
pcb[0]=netPCB
