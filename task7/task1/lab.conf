# task7/task1 — 路由器 DHCP 服务（图 1）
#
#   Router A 2621 (F0/0) —— Switch A DCS3600 (E0/7)
#                              ├── E0/3  PCA
#                              └── E0/6  PCB
#
# 三台设备处在同一个广播域（同一个 VLAN），交换机只做透明转发，
# 所以在 Kathara 里把 r1 / pca / pcb 直接接到同一个 collision domain，
# 数据面与"经过交换机"完全等价（macOS 上尤其需要这样，见 README）。

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netLAN

pca[type]="pc"
pca[0]=netLAN

pcb[type]="pc"
pcb[0]=netLAN
