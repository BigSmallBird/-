# task7/task2 — 交换机 DHCP 服务（图 2）
#
#   DCRS552 三层交换机（网关 + DHCP 服务器）
#     ├── 端口 2   PCA   IP：自动获取
#     └── 端口 10  PCB   IP：自动获取
#
# 两个端口都在默认 VLAN 1，属于同一个广播域。
# Kathara 里用一台 kathara/base 同时模拟
#   "二层交换 + interface vlan 1 + DHCP 服务器"，
# 它的 eth0 就相当于 DCRS552 的 interface vlan 1。

l3sw[type]="router"
l3sw[image]="kathara/base"
l3sw[sysctl]="net.ipv4.ip_forward=1"
l3sw[0]=netLAN

pca[type]="pc"
pca[0]=netLAN

pcb[type]="pc"
pcb[0]=netLAN
