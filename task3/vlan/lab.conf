# task3/vlan: 用 802.1Q 子接口还原「单臂路由 / 三层交换机」效果
# （macOS/OrbStack 可跑，不需要交换机容器，不会广播风暴）
#
# 原来的做法需要一台二层交换机把 VLAN100/200 打成 trunk 送到路由器。
# 这里把交换机的活交给 Docker 的二层广播域：所有设备挂在同一个
# collision domain 上，靠 802.1Q 标签区分 VLAN。
#
#   PC A (VLAN100) ┐
#   PC B (VLAN100) ┤
#                  ├── netTrunk ── r1: eth0.100 / eth0.200
#   PC C (VLAN200) ┤
#   PC D (VLAN200) ┘
#
# 效果与图 1（单臂路由）、图 3（三层交换机 VLANIF）的三层行为完全一致：
# 每个 VLAN 一个网关，跨 VLAN 必须经过这台三层设备。

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netTrunk

pca[type]="pc"
pca[0]=netTrunk

pcb[type]="pc"
pcb[0]=netTrunk

pcc[type]="pc"
pcc[0]=netTrunk

pcd[type]="pc"
pcd[0]=netTrunk
