# task3: 两个网段的互访（macOS/OrbStack 安全版，无 OVS 交换机）
#
# 拓扑（对应 task3/image.png）：
#
#   192.168.1.10 ┐                        ┌ 192.168.2.10
#   PC A         ├── netAB ── r1 ── netCD ─┤ PC C
#   192.168.1.11 ┘  192.168.1.1  192.168.2.1└ 192.168.2.11
#   PC B                                   PC D
#
# 原来的 sw1/sw2 每台只接「2 台 PC + 1 个路由器口」，且三个口同属 VLAN 1，
# 等价于一个二层广播域。所以这里直接把 netA/netB/netAB 合并成 netAB，
# netC/netD/netCD 合并成 netCD —— 二层行为完全一致，三层配置一字不改，
# 但不会触发 OrbStack/katharanp 的 hairpin 广播风暴。
#
# 要还原真实交换机（Linux/Kali），用上一层的 lab.conf。

r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netAB
r1[1]=netCD

pca[type]="pc"
pca[0]=netAB

pcb[type]="pc"
pcb[0]=netAB

pcc[type]="pc"
pcc[0]=netCD

pcd[type]="pc"
pcd[0]=netCD
