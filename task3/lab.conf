
# 路由器拓扑配置
r1[type]="router"
r1[image]="kathara/base"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[0]=netAB
r1[1]=netCD

# 交换机路由配置
sw1[type]="switch"
sw1[image]="kathara/openvswitch"
sw1[0]=netA
sw1[1]=netB
sw1[2]=netAB

sw2[type]="switch"
sw2[image]="kathara/openvswitch"
sw2[0]=netC
sw2[1]=netD
sw2[2]=netCD

# PC 配置
pca[type]="pc"
pca[0]=netA

pcb[type]="pc"
pcb[0]=netB

pcc[type]="pc"
pcc[0]=netC

pcd[type]="pc"
pcd[0]=netD